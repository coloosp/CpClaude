<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你好，世界 · 一个简单的网页</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1b1f2a;
      --muted: #6b7280;
      --accent: #5b6cff;
      --border: #e6e8f0;
      --shadow: 0 10px 30px rgba(27, 31, 42, .08);
    }

    html[data-theme="dark"] {
      --bg: #0f1218;
      --card: #171b24;
      --text: #e9ecf3;
      --muted: #98a2b3;
      --accent: #7f8cff;
      --border: #262c39;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .wrap { width: 100%; max-width: 760px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(24px, 4vw, 34px);
      margin: 0;
      letter-spacing: -.5px;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 0;
      font-size: 14px;
    }

    #themeToggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s, border-color .2s;
    }

    #themeToggle:hover { transform: translateY(-1px); border-color: var(--accent); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      transition: background .25s, border-color .25s;
    }

    .card h2 {
      font-size: 15px;
      margin: 0 0 8px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .3px;
    }

    .card p { margin: 0; line-height: 1.7; font-size: 15px; }

    .counter {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .count {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 72px;
      text-align: center;
      color: var(--accent);
    }

    button.btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }

    button.btn:hover { border-color: var(--accent); }
    button.btn:active { transform: scale(.96); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 26px;
    }

    code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>你好，<span>世界</span> 👋</h1>
        <p class="subtitle">一个单文件 HTML 页面 · 无任何依赖</p>
      </div>
      <button id="themeToggle" type="button">🌙 深色</button>
    </header>

    <section class="card">
      <h2>这是什么</h2>
      <p>
        这是用 HTML + CSS + JavaScript 写的一个静态网页，全部内容都在一个
        <code>index.html</code> 文件里。直接双击用浏览器打开就能看到，不需要服务器。
      </p>
    </section>

    <section class="card">
      <h2>试一下交互</h2>
      <p>下面的按钮由一小段 JavaScript 驱动，说明页面是“活着”的。</p>
      <div class="counter">
        <button class="btn" id="minus" type="button">−</button>
        <div class="count" id="count">0</div>
        <button class="btn" id="plus" type="button">+</button>
        <button class="btn" id="reset" type="button">重置</button>
      </div>
    </section>

    <section class="card">
      <h2>本地起服务（可选）</h2>
      <p>如果想让同一局域网的其他设备访问，可以在该目录执行：</p>
      <p style="margin-top:10px"><code>python3 -m http.server 8000</code></p>
      <p style="margin-top:8px">然后浏览器打开 <code>http://localhost:8000</code>。</p>
    </section>

    <footer>由 AI 生成 · <span id="year"></span></footer>
  </div>

  <script>
    // ---- 主题切换 ----
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
      root.dataset.theme = theme;
      toggle.textContent = theme === 'dark' ? '☀️ 浅色' : '🌙 深色';
      try { localStorage.setItem('theme', theme); } catch (e) {}
    }

    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    toggle.addEventListener('click', () => {
      applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    // ---- 计数器 ----
    let n = 0;
    const countEl = document.getElementById('count');
    const render = () => { countEl.textContent = n; };

    document.getElementById('plus').addEventListener('click', () => { n++; render(); });
    document.getElementById('minus').addEventListener('click', () => { n--; render(); });
    document.getElementById('reset').addEventListener('click', () => { n = 0; render(); });

    // ---- 年份 ----
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
